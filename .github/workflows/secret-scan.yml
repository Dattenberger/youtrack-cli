# Secret scan of every pull request (robotico-ci-public), required by the organisation ruleset secret-scan.
name: secret-scan

on:
  # edited: a PR moved to another base branch is scanned again over the new range.
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  secret-scan:
    uses: Dattenberger/robotico-ci-public/.github/workflows/secret-scan.yml@v1
    permissions:
      contents: read
    with:
      history: pr
